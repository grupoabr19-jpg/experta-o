services:
  - type: web
    name: playbook-vendas-grupo-abr
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SALES_DATA_MODE
        value: api
      - key: ADMIN_TOKEN
        sync: false
      - key: SALES_DATA_URL
        value: https://docs.google.com/spreadsheets/d/1JIh_mw9_VH_EbRLjbZ996N5w4-BOhDHAquRdwvgqtxc/gviz/tq?tqx=out:csv&sheet=Ranking_Saida
      - key: ASTER_API_URL
        sync: false
      - key: ASTER_AUTH_TOKEN
        sync: false
      - key: KOMMO_API_URL
        sync: false
      - key: KOMMO_AUTH_TOKEN
        sync: false
