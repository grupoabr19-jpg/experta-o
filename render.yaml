services:
  - type: web
    name: playbook-vendas-grupo-abr
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SALES_DATA_MODE
        value: api
      - key: ADMIN_TOKEN
        sync: false
      - key: SALES_DATA_URL
        value: https://docs.google.com/spreadsheets/d/10XOSE1z8HucS0_5K_8iX8VFg6s0ASZJwDAMfo0uacIA/gviz/tq?tqx=out:csv&sheet=2_Ranking%20por%20Vendedor&range=A5:K1000
      - key: SALES_TEAM_DATA_URL
        value: https://docs.google.com/spreadsheets/d/10XOSE1z8HucS0_5K_8iX8VFg6s0ASZJwDAMfo0uacIA/gviz/tq?tqx=out:csv&sheet=3_Ranking%20por%20Regi%C3%A3o&range=A5:H1000
      - key: KOMMO_API_URL
        sync: false
      - key: KOMMO_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IDEAACO_EMAIL_USER
        sync: false
      - key: IDEAACO_EMAIL_APP_PASSWORD
        sync: false
      - key: IDEAACO_SMTP_HOST
        sync: false
      - key: IDEAACO_SMTP_PORT
        sync: false
      - key: IDEAACO_SMTP_SECURE
        sync: false
      - key: CELEBRATION_EMAIL_PROVIDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CELEBRATION_EMAIL_FROM
        sync: false
      - key: NEON_AUTH_BASE_URL
        value: https://ep-little-union-a69b2ecz.neonauth.us-west-2.aws.neon.tech/neondb/auth
      - key: APP_ORIGIN
        value: https://experta-o.onrender.com
