services:
  - type: web
    name: playbook-vendas-grupo-abr
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SALES_DATA_MODE
        value: api
      - key: ADMIN_TOKEN
        sync: false
      - key: SALES_DATA_URL
        value: https://docs.google.com/spreadsheets/d/1JIh_mw9_VH_EbRLjbZ996N5w4-BOhDHAquRdwvgqtxc/gviz/tq?tqx=out:csv&sheet=Ranking_Saida
      - key: ASTER_BASE_URL
        sync: false
      - key: ASTER_COMPANY_DB
        sync: false
      - key: ASTER_USERNAME
        sync: false
      - key: ASTER_PASSWORD
        sync: false
      - key: ASTER_AUTH_TOKEN
        sync: false
      - key: KOMMO_API_URL
        sync: false
      - key: KOMMO_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IDEAACO_EMAIL_USER
        sync: false
      - key: IDEAACO_EMAIL_APP_PASSWORD
        sync: false
      - key: NEON_AUTH_BASE_URL
        value: https://ep-little-union-a69b2ecz.neonauth.us-west-2.aws.neon.tech/neondb/auth
      - key: APP_ORIGIN
        value: https://experta-o.onrender.com
